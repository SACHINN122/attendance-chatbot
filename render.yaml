services:
  - type: web
    name: nsut-attendance-bot
    env: python
    buildCommand: cd backend && pip install -r requirements.txt && playwright install chromium
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: 0
      - key: PYTHON_VERSION
        value: 3.10.0
