services:
  - type: web
    name: kairon-attendance-assistant
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/playwright python -m playwright install --with-deps chromium
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/playwright
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: HOST
        value: "0.0.0.0"
      - key: roll_no
        sync: false
      - key: password
        sync: false
